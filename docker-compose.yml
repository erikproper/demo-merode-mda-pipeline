name: mda-thesis

services:

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mda-mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mda-agents/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    networks:
      - mda-bus
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 3

  api-server:
    build:
      context: ./mda-agents
      dockerfile: Dockerfile
    container_name: mda-api-server
    command: node dist/api-server.js
    ports:
      - "3001:3001"
    environment:
      API_PORT: "3001"
      MQTT_BROKER: mqtt-broker
      MQTT_PORT: "1883"
      MQTT_USER: admin
      MQTT_PASSWORD: admin
      BUS_PREFIX: big
      BUS_ENVIRONMENT_ID: dev
      BUS_AGENT_ID: api-server
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mda-bus

  transformer-agent:
    build:
      context: ./mda-agents
      dockerfile: Dockerfile
    container_name: mda-transformer-agent
    command: node dist/demo-to-pim-agent.js
    environment:
      MQTT_BROKER: mqtt-broker
      MQTT_PORT: "1883"
      MQTT_USER: admin
      MQTT_PASSWORD: admin
      BUS_PREFIX: big
      BUS_ENVIRONMENT_ID: dev
      BUS_AGENT_ID: demo-to-pim-agent
      DEMO_PUBLISHER_AGENT_ID: api-server
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mda-bus

  mendix-agent:
    build:
      context: ./mda-agents
      dockerfile: Dockerfile
    container_name: mda-mendix-agent
    command: node dist/pim-to-mendix-agent.js
    environment:
      MQTT_BROKER: mqtt-broker
      MQTT_PORT: "1883"
      MQTT_USER: admin
      MQTT_PASSWORD: admin
      BUS_PREFIX: big
      BUS_ENVIRONMENT_ID: dev
      BUS_AGENT_ID: pim-to-mendix-agent
    env_file:
      - ./mda-agents/.env
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mda-bus

  # Usage: docker compose --profile publisher run --rm demo-publisher
  demo-publisher:
    build:
      context: ./mda-agents
      dockerfile: Dockerfile
    container_name: mda-demo-publisher
    command: node dist/demo-publisher.js
    profiles:
      - publisher
    environment:
      MQTT_BROKER: mqtt-broker
      MQTT_PORT: "1883"
      MQTT_USER: admin
      MQTT_PASSWORD: admin
      BUS_PREFIX: big
      BUS_ENVIRONMENT_ID: dev
      BUS_AGENT_ID: demo-publisher
    depends_on:
      mqtt-broker:
        condition: service_healthy
    networks:
      - mda-bus

networks:
  mda-bus:
    driver: bridge
