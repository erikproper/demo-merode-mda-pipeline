# Automatically deploys the pipeline to the Raspberry Pi on every push to main.
#
# Strategy: self-hosted GitHub Actions runner on the Pi.
# The runner polls GitHub for jobs, so it works from any network (no open ports needed).
#
# One-time setup on the Raspberry Pi:
#   1. Clone this repo:
#        git clone https://github.com/<your-user>/<your-repo>.git ~/Projects/mda-master-thesis-workspace
#
#   2. Add mda.tlolab.com to your Cloudflare Tunnel config (see cloudflare-tunnel.md)
#
#   3. Register the self-hosted runner:
#        GitHub repo -> Settings -> Actions -> Runners -> New self-hosted runner
#        Choose: Linux / ARM64, label: raspberry-pi
#        Start as service: sudo ./svc.sh install && sudo ./svc.sh start
#
#   4. Add GitHub Secrets (repo -> Settings -> Secrets -> Actions):
#        MENDIX_TOKEN        your Mendix Personal Access Token
#        MENDIX_APP_ID       your Mendix App UUID

name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy on Pi
    runs-on: [self-hosted, raspberry-pi]

    steps:
      - name: Pull latest main
        run: |
          cd ~/Projects/mda-master-thesis-workspace
          git fetch origin main
          git reset --hard origin/main
          echo "Code updated to $(git log -1 --oneline)"

      - name: Write .env for mendix-agent
        run: |
          cat > ~/Projects/mda-master-thesis-workspace/mda-agents/.env <<'ENVEOF'
          MQTT_BROKER=localhost
          MQTT_PORT=1883
          MQTT_USER=admin
          MQTT_PASSWORD=admin
          BUS_PREFIX=big
          BUS_ENVIRONMENT_ID=dev
          MENDIX_TOKEN=${{ secrets.MENDIX_TOKEN }}
          MENDIX_APP_ID=${{ secrets.MENDIX_APP_ID }}
          MENDIX_MODULE_NAME=${{ vars.MENDIX_MODULE_NAME || 'MyFirstModule' }}
          MENDIX_BRANCH=${{ vars.MENDIX_BRANCH || 'main' }}
          ENVEOF
          echo ".env written"

      - name: Rebuild & restart Docker Compose services
        run: |
          cd ~/Projects/mda-master-thesis-workspace
          docker compose build --pull
          docker compose up -d --remove-orphans
          echo "Services restarted"

      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health)
          if [ "$STATUS" = "200" ]; then
            echo "API server healthy - https://mda.tlolab.com/health"
          else
            echo "Health check failed (HTTP $STATUS)"
            docker compose -f ~/Projects/mda-master-thesis-workspace/docker-compose.yml logs --tail=20
            exit 1
          fi

      - name: Print running services
        run: |
          cd ~/Projects/mda-master-thesis-workspace
          docker compose ps
